version: 2

sources:
  - name: raw
    schema: raw
    description: "Real MetricMind dataset - as loaded from team CSV files, no transformation applied yet."
    tables:
      - name: customers
        description: "Customer master data (500 rows) - customer_id, name, country, region, segment"

      - name: products
        description: "Product catalogue (12 rows) - product_id, name, category, unit_price, unit_cost"

      - name: date_dimension
        description: "Calendar dimension for 2025 (365 rows) - date, year, quarter, month, week, day"

      - name: orders
        description: "Order-level fact table (10,000 rows) - revenue/cost/profit/margin already calculated in source"

      - name: costs
        description: "Order-level cost breakdown (10,000 rows) - material, shipping, operational costs"