version: 2

models:

  - name: dim_customers
    description: "Customer dimension containing customer attributes."

    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        data_tests:
          - not_null
          - unique


  - name: dim_products
    description: "Product dimension containing product information and pricing."

    columns:
      - name: product_id
        description: "Unique identifier for each product."
        data_tests:
          - not_null
          - unique


  - name: dim_date
    description: "Date dimension used for time-based analysis."

    columns:
      - name: date
        description: "Calendar date."
        data_tests:
          - not_null
          - unique


  - name: fct_orders
    description: "Order-level fact table containing sales and profitability metrics."

    columns:
      - name: order_id
        description: "Unique identifier for each order."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Customer associated with the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: product_id
        description: "Product associated with the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: order_date
        description: "Date on which the order was placed."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date

      - name: order_status
        description: "Current status of the order."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Completed
                  - Cancelled
                  - Returned


  - name: fct_costs
    description: "Order-level cost fact table containing operational cost components."

    columns:
      - name: order_id
        description: "Order associated with the cost record."
        data_tests:
          - not_null
          - unique

      - name: product_id
        description: "Product associated with the cost record."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
